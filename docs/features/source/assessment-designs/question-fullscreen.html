<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #1A1C18; font-family: 'DM Sans', -apple-system, sans-serif; }

  .screen {
    min-height: 100vh;
    display: flex; flex-direction: column;
    background: #141613;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px 0;
    flex-shrink: 0;
  }
  .topbar-logo { font-size: 13px; font-weight: 600; color: #BFEA4A; letter-spacing: 0.5px; }
  .topbar-step { font-size: 13px; color: #4A4D42; }
  .topbar-close {
    font-size: 13px; color: #4A4D42; cursor: pointer;
    background: #1A1C18; border: 1px solid #2E3029; border-radius: 100px;
    padding: 6px 12px; font-family: inherit;
    transition: border-color 0.15s;
  }
  .topbar-close:hover { border-color: #4A4D42; color: #8A8D7E; }

  /* ── Progress ── */
  .progress-wrap { padding: 16px 24px 0; flex-shrink: 0; }
  .progress-track { height: 2px; background: #2A2C28; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 2px; border-radius: 2px; background: #BFEA4A; width: 16%; }

  /* ── Body ── */
  .body {
    flex: 1; padding: 40px 24px 0;
    display: flex; flex-direction: column;
  }

  .q-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.1px;
    color: #4A4D42; margin-bottom: 20px;
  }
  .q-text {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(24px, 5vw, 32px);
    font-weight: 700; color: #FFF;
    line-height: 1.25; margin-bottom: 40px;
  }

  /* ── Options ── */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 16px;
    background: #1A1C18; border: 1px solid #2A2C28;
    border-radius: 16px; padding: 18px 20px;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
    -webkit-tap-highlight-color: transparent;
  }
  .opt:hover { border-color: #3A3D30; }
  .opt.selected { border-color: #BFEA4A; background: rgba(191,234,74,0.06); }
  .opt.selected .opt-label { color: #FFF; font-weight: 500; }
  .opt.selected .opt-num { color: #BFEA4A; }

  .radio {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #3A3D30; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt.selected .radio { background: #BFEA4A; border-color: #BFEA4A; }
  .radio-dot { width: 8px; height: 8px; background: #1A1C18; border-radius: 50%; display: none; }
  .opt.selected .radio-dot { display: block; }

  .opt-label { font-size: 16px; color: #8A8D7E; flex: 1; }
  .opt-num { font-size: 12px; color: #3A3D30; }

  /* ── Bottom ── */
  .bottom {
    padding: 24px 24px 40px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .back-btn {
    background: none; border: 1px solid #2E3029; border-radius: 100px;
    padding: 11px 20px; color: #4A4D42; font-size: 13px;
    cursor: pointer; font-family: inherit;
    transition: border-color 0.15s;
  }
  .back-btn:hover { border-color: #4A4D42; color: #8A8D7E; }
  .bottom-hint { font-size: 12px; color: #3A3D30; }

  /* live interactive */
  .opt { cursor: pointer; }
</style>
</head>
<body>

<div class="screen">
  <div class="topbar">
    <span class="topbar-logo">mande</span>
    <span class="topbar-step">7 of 42</span>
    <button class="topbar-close" onclick="alert('Exits assessment — progress saved')">Exit</button>
  </div>

  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="fill"></div>
    </div>
  </div>

  <div class="body">
    <div class="q-label">Career Interest Assessment</div>
    <div class="q-text" id="qtext">"I like to build things"</div>

    <div class="options" id="options">
      <div class="opt" onclick="pick(this, 1)">
        <div class="radio"><div class="radio-dot"></div></div>
        <span class="opt-label">Not like me at all</span>
        <span class="opt-num">1</span>
      </div>
      <div class="opt" onclick="pick(this, 2)">
        <div class="radio"><div class="radio-dot"></div></div>
        <span class="opt-label">Not much like me</span>
        <span class="opt-num">2</span>
      </div>
      <div class="opt" onclick="pick(this, 3)">
        <div class="radio"><div class="radio-dot"></div></div>
        <span class="opt-label">Somewhat like me</span>
        <span class="opt-num">3</span>
      </div>
      <div class="opt" onclick="pick(this, 4)">
        <div class="radio"><div class="radio-dot"></div></div>
        <span class="opt-label">Very much like me</span>
        <span class="opt-num">4</span>
      </div>
    </div>
  </div>

  <div class="bottom">
    <button class="back-btn" onclick="prev()">← Back</button>
    <span class="bottom-hint" id="hint"></span>
  </div>
</div>

<script>
  const questions = [
    "I like to build things",
    "I like to do puzzles",
    "I am good at working independently",
    "I like to work in teams",
    "I am an ambitious person, I set goals for myself",
    "I like to organize things",
    "I like to read about art and music",
  ];
  let current = 6; // start at q7 for demo
  let locked = false;

  function updateQ() {
    document.getElementById('qtext').textContent = `"${questions[current]}"`;
    document.getElementById('fill').style.width = `${Math.round(((current+1)/42)*100)}%`;
    document.querySelector('.topbar-step').textContent = `${current+1} of 42`;
    document.getElementById('hint').textContent = '';
    document.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
    locked = false;
  }

  function pick(el, val) {
    if (locked) return;
    locked = true;
    el.classList.add('selected');
    document.getElementById('hint').textContent = 'Next question…';
    setTimeout(() => {
      if (current < questions.length - 1) {
        current++;
        updateQ();
      } else {
        document.getElementById('hint').textContent = 'Assessment complete!';
      }
    }, 320);
  }

  function prev() {
    if (current > 0) { current--; updateQ(); }
  }
</script>
</body>
</html>
